<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .input-group:focus-within label { color: #3b82f6; }
        .input-group:focus-within i { color: #3b82f6; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="p-8 text-center bg-gradient-to-b from-white to-slate-50">
        <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4 -rotate-3 hover:rotate-0 transition-transform duration-300">
            <i class="fas fa-user-plus text-2xl text-emerald-600"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Daftar Akun</h1>
        <p class="text-slate-500 text-sm">Buat akun baru Anda</p>
    </div>

    <!-- Form -->
    <form th:action="@{/register}" method="post" th:object="${request}" class="p-8 pt-2 space-y-5">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Username -->
            <div class="input-group space-y-2">
                <label class="block text-sm font-semibold text-slate-700 ml-1">Username</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                    <input type="text" th:field="*{username}" placeholder="Username"
                           class="w-full pl-12 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group space-y-2">
                <label class="block text-sm font-semibold text-slate-700 ml-1">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                    <input type="password" th:field="*{password}" placeholder="Password"
                           class="w-full pl-12 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Nama -->
            <div class="input-group space-y-2">
                <label class="block text-sm font-semibold text-slate-700 ml-1">Nama</label>
                <div class="relative">
                    <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                    <input type="text" th:field="*{nama}" placeholder="Nama lengkap"
                           class="w-full pl-12 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
                </div>
            </div>

            <!-- Alamat -->
            <div class="input-group space-y-2">
                <label class="block text-sm font-semibold text-slate-700 ml-1">Alamat</label>
                <div class="relative">
                    <i class="fas fa-map-marker-alt absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                    <input type="text" th:field="*{alamat}" placeholder="Alamat"
                           class="w-full pl-12 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div class="pt-2">
            <button type="submit"
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 transform hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                <span>Register</span>
                <i class="fas fa-user-check text-sm"></i>
            </button>
        </div>

    </form>
</div>

</body>
</html>
