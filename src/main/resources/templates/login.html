<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .input-group:focus-within label { color: #3b82f6; }
        .input-group:focus-within i { color: #3b82f6; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="p-8 text-center bg-gradient-to-b from-white to-slate-50">
        <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4 rotate-3 hover:rotate-6 transition-transform duration-300">
            <i class="fas fa-shield-alt text-2xl text-blue-600"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Masuk</h1>
        <p class="text-slate-500 text-sm">Silakan login ke akun Anda</p>
    </div>

    <!-- Form -->
    <form th:action="@{/login}" method="post" class="p-8 pt-2 space-y-6">

        <!-- Username -->
        <div class="input-group space-y-2">
            <label class="block text-sm font-semibold text-slate-700 ml-1">Username</label>
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                <input type="text" name="username" placeholder="Masukkan username"
                       class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
            </div>
        </div>

        <!-- Password -->
        <div class="input-group space-y-2">
            <label class="block text-sm font-semibold text-slate-700 ml-1">Password</label>
            <div class="relative">
                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors"></i>
                <input type="password" name="password" placeholder="Masukkan password"
                       class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all duration-300 text-slate-800 placeholder:text-slate-400">
            </div>
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 transform hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
            <span>Login</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>

    </form>

    <!-- Footer -->
    <div class="p-6 bg-slate-50 border-t border-slate-100 text-center">
        <p class="text-slate-500 text-sm mb-3">Belum punya akun?</p>
        <a th:href="@{/register}"
           class="inline-flex items-center text-blue-600 hover:text-blue-700 font-semibold transition-colors hover:underline decoration-2 underline-offset-4">
            Register disini
            <i class="fas fa-external-link-alt ml-1 text-xs"></i>
        </a>
    </div>
</div>

</body>
</html>
